<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-WIT · Chấm công EF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Exo+2:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pur:#3D0A6E; --grn:#1FAF6E; --lav:#ECE3F6; --crm:#FFF4DC; --mnt:#E3F6EC; --mntt:#137A4C;
    --txt:#2B2238; --mut:#6B5E7B; --band:#F7F2FB; --ef:#EFE6F7; --org:#FFD8A8; --line:#E4DAF0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--txt);font:14px/1.45 "Be Vietnam Pro",system-ui,sans-serif}
  header{background:var(--pur);color:#fff;padding:14px 16px}
  header h1{margin:0;font:700 20px/1.2 "Exo 2",sans-serif;letter-spacing:.3px}
  header .tag{color:var(--grn);font:600 12px "Exo 2",sans-serif;letter-spacing:1.5px;margin-top:2px}
  .bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:12px 16px;background:var(--band);border-bottom:1px solid var(--line)}
  .field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);font-weight:600}
  input{font:600 14px "Be Vietnam Pro",sans-serif;color:var(--mntt);background:var(--mnt);border:1px solid #bfe6d1;border-radius:8px;padding:6px 8px;min-height:36px}
  input[type=search]{color:var(--txt);background:#fff;border-color:var(--line);min-width:180px}
  .quick{display:flex;gap:6px;flex-wrap:wrap}
  button{font:600 13px "Be Vietnam Pro",sans-serif;border:1px solid var(--pur);background:#fff;color:var(--pur);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
  button.primary{background:var(--pur);color:#fff}
  button:hover{filter:brightness(.95)}
  .kpis{display:flex;gap:22px;padding:14px 16px;flex-wrap:wrap}
  .kpi b{display:block;font:700 26px "Exo 2",sans-serif;color:var(--grn);line-height:1}
  .kpi span{font-size:12px;color:var(--mut)}
  .warn{margin:0 16px 10px;padding:8px 12px;border-radius:8px;background:var(--org);font-size:13px;display:none}
  .msg{padding:10px 16px;font-size:13px;color:var(--mut)}
  .msg.err{color:#b3261e}
  .tabs{display:flex;gap:6px;padding:0 16px 10px}
  .tabs button.on{background:var(--pur);color:#fff}
  .box{padding:0 16px 16px;overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:520px}
  th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  thead th{background:var(--pur);color:#fff;font:600 12px "Exo 2",sans-serif;position:sticky;top:0}
  th.n,td.n{text-align:center;width:90px}
  tbody tr.sum:nth-child(4n+1){background:#fff}
  tr.sum{cursor:pointer}
  tr.sum:hover{background:var(--band)}
  tr.sum td.name{font-weight:700;color:var(--pur)}
  tr.sum td.n b{font:700 15px "Exo 2",sans-serif;color:var(--grn)}
  tr.det td{background:var(--band);padding:0 10px 10px}
  tr.det table{min-width:0;margin-top:6px;font-size:12.5px}
  tr.det thead th{background:var(--lav);color:var(--pur)}
  .caret{display:inline-block;width:14px;color:var(--mut)}
  tfoot td{font-weight:700;border-top:2px solid var(--pur)}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:700}
  .chip.founder{box-shadow:0 0 0 2px var(--grn)}
  footer{padding:8px 16px 16px;font-size:11px;color:var(--mut)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--lav);border-top-color:var(--pur);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  @media print{.bar,.tabs,button{display:none!important} tr.det{display:table-row!important}}
</style>
</head>
<body>
<header>
  <h1>THỐNG KÊ & CHẤM CÔNG EF</h1>
  <div class="tag">E-WIT · DÀNH CHO BAN TỔ CHỨC</div>
</header>

<div class="bar">
  <label class="field">Từ ngày<input type="date" id="from"></label>
  <label class="field">Đến ngày<input type="date" id="to"></label>
  <div class="quick">
    <button class="primary" id="btnView">Xem</button>
    <button data-q="this">Tháng này</button>
    <button data-q="prev">Tháng trước</button>
  </div>
  <label class="field">Tìm EF / lớp<input type="search" id="q" placeholder="Nhập tên…"></label>
  <div class="quick"><button id="btnCsv">Tải CSV</button><button id="btnPrint">In</button></div>
</div>

<div class="kpis">
  <div class="kpi"><b id="kTotal">–</b><span>tổng buổi EF</span></div>
  <div class="kpi"><b id="kEF">–</b><span>EF có lên lớp</span></div>
  <div class="kpi"><b id="kClass">–</b><span>lớp có buổi</span></div>
</div>
<div class="warn" id="warn"></div>
<div class="msg" id="msg"><span class="spin"></span>Đang tải dữ liệu…</div>

<div class="tabs"><button class="on" data-v="ef">Theo EF</button><button data-v="cls">Theo lớp</button></div>
<div class="box"><table id="tbl"></table></div>
<footer id="foot"></footer>

<script>
const $ = id => document.getElementById(id);
const DOW = ['CN','T2','T3','T4','T5','T6','T7'];
let DATA = null, VIEW = 'ef', OPEN = new Set();
const DEF_BG = '#F9CBF4', DEF_FG = '#2B2238', FOUNDER = 'Mr. Okie';
const chip = n => { const c = (DATA.efColors||{})[n] || {}; return `<span class="chip${n===FOUNDER?' founder':''}" style="background:${c.bg||DEF_BG};color:${c.fg||DEF_FG}">${esc(n)}</span>`; };

const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const vn = s => { const x = parse(s); return DOW[x.getDay()]+' '+pad(x.getDate())+'/'+pad(x.getMonth()+1)+'/'+x.getFullYear(); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function setMonth(kind){
  const t = new Date(); const m = kind==='prev' ? t.getMonth()-1 : t.getMonth();
  $('from').value = ymd(new Date(t.getFullYear(), m, 1));
  $('to').value = ymd(new Date(t.getFullYear(), m+1, 0));
}
function showMsg(html, err){ const m = $('msg'); m.innerHTML = html; m.className = 'msg'+(err?' err':''); m.style.display = html?'block':'none'; }

function load(){
  const f = $('from').value, t = $('to').value;
  if (!f || !t) return showMsg('Vui lòng chọn đủ Từ ngày và Đến ngày.', true);
  if (t < f) return showMsg('“Đến ngày” đang trước “Từ ngày”.', true);
  showMsg('<span class="spin"></span>Đang tải dữ liệu…'); OPEN.clear();
  google.script.run
    .withSuccessHandler(d => { DATA = d; render(); })
    .withFailureHandler(e => showMsg('Không tải được dữ liệu: '+esc(e.message||e)+'. Nếu bạn chưa được chia sẻ quyền xem file lịch, vui lòng liên hệ người quản lý.', true))
    .getData(f, t);
}

function efRows(){
  const q = $('q').value.trim().toLowerCase();
  return DATA.rows.filter(r => r.type === 'EF' && (!q || r.ef.toLowerCase().includes(q) || r.cls.toLowerCase().includes(q)));
}

function render(){
  const all = DATA.rows.filter(r => r.type === 'EF');
  const rows = efRows();
  $('kTotal').textContent = all.length;
  $('kEF').textContent = new Set(all.map(r => r.ef)).size;
  $('kClass').textContent = new Set(all.map(r => r.cls)).size;
  // Cảnh báo: tên EF chưa có trong DS_EF, hoặc nội dung lạ (không phải EF/thầy cô/trạng thái/team) -> chưa được tính
  const bad = DATA.rows.filter(r => r.type === 'EF chưa có trong DS_EF');
  const odd = DATA.rows.filter(r => r.type === 'Khác');
  const msgs = [];
  if (bad.length) msgs.push(`Có <b>${bad.length}</b> ô ghi tên EF chưa có trong DS_EF: ` + [...new Set(bad.map(b => b.ef))].map(esc).join(', '));
  if (odd.length) msgs.push(`Có <b>${odd.length}</b> ô ghi nội dung lạ: ` + [...new Set(odd.map(b => b.content.replace(/\s+/g,' ')))].map(esc).join(', '));
  $('warn').style.display = msgs.length ? 'block' : 'none';
  $('warn').innerHTML = msgs.length ? '⚠ Các ô sau <b>chưa được tính công</b>. ' + msgs.join('. ') + '. Vui lòng báo người nhập liệu sửa lại.' : '';

  const key = VIEW === 'ef' ? 'ef' : 'cls', sub = VIEW === 'ef' ? 'cls' : 'ef';
  const groups = {};
  rows.forEach(r => (groups[r[key]] = groups[r[key]] || []).push(r));
  const names = Object.keys(groups).sort((a,b) => groups[b].length - groups[a].length || a.localeCompare(b,'vi'));

  let h = `<thead><tr><th>${VIEW==='ef'?'EF':'Lớp'}</th><th class="n">Số buổi</th><th class="n">${VIEW==='ef'?'Số lớp':'Số EF'}</th><th>${VIEW==='ef'?'Các lớp':'Các EF'}</th></tr></thead><tbody>`;
  names.forEach(n => {
    const g = groups[n], cnt = {};
    g.forEach(r => cnt[r[sub]] = (cnt[r[sub]]||0)+1);
    const parts = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(k => esc(k)+' ('+cnt[k]+')').join(' · ');
    const open = OPEN.has(n);
    h += `<tr class="sum" data-k="${esc(n)}"><td class="name"><span class="caret">${open?'▾':'▸'}</span>${esc(n)}</td><td class="n"><b>${g.length}</b></td><td class="n">${Object.keys(cnt).length}</td><td>${parts}</td></tr>`;
    h += `<tr class="det" style="display:${open?'table-row':'none'}"><td colspan="4"><table><thead><tr><th>Ngày</th><th>Lớp</th><th>Giờ</th><th>EF</th></tr></thead><tbody>` +
      g.slice().sort((a,b)=>a.d.localeCompare(b.d)||a.time.localeCompare(b.time)).map(r => `<tr><td>${vn(r.d)}</td><td>${esc(r.cls)}</td><td>${esc(r.time)}</td><td>${esc(r.ef)}</td></tr>`).join('') +
      '</tbody></table></td></tr>';
  });
  h += `</tbody><tfoot><tr><td>Tổng</td><td class="n">${rows.length}</td><td class="n"></td><td></td></tr></tfoot>`;
  $('tbl').innerHTML = names.length ? h : '';
  showMsg(names.length ? '' : 'Không có buổi EF nào trong khoảng ngày này.');
  document.querySelectorAll('tr.sum').forEach(tr => tr.onclick = () => {
    const k = tr.dataset.k; OPEN.has(k) ? OPEN.delete(k) : OPEN.add(k); render();
  });
  $('foot').textContent = `Khoảng ${vn($('from').value)} → ${vn($('to').value)} · chỉ tính EF đứng lớp/giám khảo có tên trong DS_EF · dữ liệu cập nhật lúc ${DATA.updated}.`;
}

function csv(){
  if (!DATA) return;
  const rows = efRows().slice().sort((a,b)=>a.ef.localeCompare(b.ef,'vi')||a.d.localeCompare(b.d));
  const q = v => '"'+String(v).replace(/"/g,'""')+'"';
  const lines = [['EF','Ngày','Thứ','Lớp','Giờ'].map(q).join(',')]
    .concat(rows.map(r => [r.ef, r.d.split('-').reverse().join('/'), DOW[parse(r.d).getDay()], r.cls, r.time].map(q).join(',')));
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `ChamCong_EF_${$('from').value}_${$('to').value}.csv`; a.click();
}

document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { setMonth(b.dataset.q); load(); });
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
  VIEW = b.dataset.v; OPEN.clear();
  document.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x===b));
  DATA && render();
});
$('btnView').onclick = load;
$('from').onchange = $('to').onchange = load;
$('q').oninput = () => DATA && render();
$('btnCsv').onclick = csv;
$('btnPrint').onclick = () => window.print();
setMonth('this'); load();
</script>
</body>
</html>
